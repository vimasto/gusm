name: Keep Supabase active

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    name: Execute database activity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query a static application table
        env:
          SUPABASE_KEEPALIVE_KEY: ${{ secrets.SUPABASE_KEEPALIVE_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          test -n "$SUPABASE_KEEPALIVE_KEY"
          test -n "$SUPABASE_PROJECT_URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --header "apikey: $SUPABASE_KEEPALIVE_KEY" \
            --header "Authorization: Bearer $SUPABASE_KEEPALIVE_KEY" \
            "${SUPABASE_PROJECT_URL%/}/rest/v1/time_block?select=time_block_id&limit=1" \
            --output /dev/null
